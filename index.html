<style>
/* Layout idea: one narrow study column; a "today" slab on top, a numbered lesson ledger below. */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --sunk:#e8edf2; --ink:#15202c; --muted:#566473; --line:#d5dde5;
  --accent:#2156c4; --accent-ink:#ffffff; --mark:#f0bf2c;
  --easy:#1f8a5b; --medium:#b26a00; --hard:#c23b3b;
  --code-bg:#101822; --code-ink:#e4ebf3;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --surface:#182029; --sunk:#111820; --ink:#e5ebf2; --muted:#94a2b1; --line:#2a3542;
    --accent:#7ea8ff; --accent-ink:#0c1420; --mark:#f0bf2c;
    --easy:#4fc48f; --medium:#f0a941; --hard:#ff7b7b;
    --code-bg:#0a0f15; --code-ink:#dfe7f0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#182029; --sunk:#111820; --ink:#e5ebf2; --muted:#94a2b1; --line:#2a3542;
  --accent:#7ea8ff; --accent-ink:#0c1420; --mark:#f0bf2c;
  --easy:#4fc48f; --medium:#f0a941; --hard:#ff7b7b;
  --code-bg:#0a0f15; --code-ink:#dfe7f0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:20px}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:3px;background:var(--mark);display:inline-block;box-shadow:6px 6px 0 var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.streak{background:var(--mark);color:#201a00;font-weight:600}
button.chip{border:0;font-family:inherit;cursor:pointer;color:var(--ink,inherit);font-weight:600}

.today{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.today .eyebrow{font-size:13px;opacity:.85}
.today h1{font-size:28px}
.today p{opacity:.92}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 25%,transparent);overflow:hidden}
.bar span{display:block;height:100%;background:var(--mark);border-radius:99px}
.today .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.today .count{font-size:14px;font-variant-numeric:tabular-nums}
.go{background:var(--accent-ink);color:var(--accent);border:0;border-radius:10px;padding:10px 16px;font-weight:600;text-decoration:none;display:inline-block}

.ledger{display:flex;flex-direction:column;gap:8px}
.ledger h2{font-size:20px}
.ledger > .cx{margin-bottom:4px}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.lrow:hover{border-color:var(--accent)}
.lrow .num{font-family:var(--mono);font-size:13px;color:var(--muted)}
.lrow .t{font-weight:600}
.lrow .b{font-size:14px;color:var(--muted)}
.dots{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.dot.done.E{background:var(--easy);border-color:var(--easy)}
.dot.done.M{background:var(--medium);border-color:var(--medium)}
.dot.done.H{background:var(--hard);border-color:var(--hard)}

.back{font-size:14px;text-decoration:none}
.lesson-head{display:flex;flex-direction:column;gap:6px}
.lesson-head .num{font-family:var(--mono);font-size:13px;color:var(--muted)}
.lesson-head h1{font-size:30px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.sec h2{font-size:19px}
.sec h3{font-size:16px}
.sec p,.sec li{max-width:65ch}
.sec ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
code{font-family:var(--mono);font-size:.9em;background:var(--sunk);padding:1px 5px;border-radius:4px}
pre{margin:0;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:14px;line-height:1.5;padding:14px;border-radius:10px;overflow-x:auto;white-space:pre;tab-size:4}
.cx{font-size:14px;color:var(--muted)}
.readbox{display:flex;align-items:center;gap:8px;font-size:15px}
.readbox input{width:18px;height:18px;accent-color:var(--accent)}
details summary{cursor:pointer;font-size:14px;color:var(--muted)}
details pre{margin-top:8px}

.prob{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.prob.E{border-left-color:var(--easy)} .prob.M{border-left-color:var(--medium)} .prob.H{border-left-color:var(--hard)}
.prob.done{background:color-mix(in srgb,var(--easy) 7%,var(--surface))}
.phead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}

.pill.E{background:var(--easy)} .pill.M{background:var(--medium)} .pill.H{background:var(--hard)}

.prob h3{font-size:18px}

.btn:hover{border-color:var(--accent)}

const LIST_PRELUDE = `class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

def build(values):
    dummy = ListNode()
    node = dummy
    for v in values:
        node.next = ListNode(v)
        node = node.next
    return dummy.next

def to_list(node):
    out = []
    while node:
        out.append(node.val)
        node = node.next
    return out
`;
const TREE_PRELUDE = `from collections import deque

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

def tree(values):
    if not values:
        return None
    root = TreeNode(values[0])
    queue = deque([root])
    i = 1
    while queue and i < len(values):
        node = queue.popleft()
        if values[i] is not None:
            node.left = TreeNode(values[i])
            queue.append(node.left)
        i += 1
        if i < len(values) and values[i] is not None:
            node.right = TreeNode(values[i])
            queue.append(node.right)
        i += 1
    return root

def flat(root):
    out, queue = [], deque([root])
    while queue:
        node = queue.popleft()
        if node:
            out.append(node.val)
            queue.append(node.left)
            queue.append(node.right)
    return out
`;

    problem:"The grid holds \"1\" for land and \"0\" for water. Count the islands, where land cells connect up, down, left and right.",
    steps:["Scan every cell. Each time you find land you have not visited, that is a new island.",

           "The DFS stops at the grid edge, at water, and at cells already seen.",
           "The number of times you start a DFS is the number of islands."],
    code:`def numIslands(grid):
    rows, cols = len(grid), len(grid[0])
    seen = set()

    def sink(r, c):
        if r < 0 or c < 0 or r >= rows or c >= cols:
            return
        if grid[r][c] == "0" or (r, c) in seen:
            return
        seen.add((r, c))
        sink(r + 1, c)
        sink(r - 1, c)
        sink(r, c + 1)
        sink(r, c - 1)

    count = 0
    for r in range(rows):
        for c in range(cols):
            if grid[r][c] == "1" and (r, c) not in seen:

                sink(r, c)
    return count`,

  concept:[

{ title:"Classes and objects", blurb:"Making your own types with class", src:["21_Day_Classes_and_objects/21_classes_and_objects.md"],
  concept:[
    "A class is a blueprint and an object is something built from it. Everyday example: a cookie cutter is the class, and each cookie is an object. Same shape, but each can have different toppings.",
    "`__init__` runs when an object is created and sets up its data. `self` means \"this particular object\", so `self.name = name` stores a name on this one.",
    "Methods are functions that belong to the class, and always take `self` first: `def greet(self):`.",
    "Inheritance builds a new class on an old one: `class Student(Person):` gets everything Person has, and can add more.",
    "LeetCode uses classes constantly: every answer sits inside `class Solution:`, and design problems ask you to build a whole class."
  ],
  code:`class Person:
    def __init__(self, name, city):
        self.name = name
        self.city = city

    def greet(self):
        return f"Hi, I'm {self.name} from {self.city}"

ada = Person("Ada", "London")
print(ada.greet())      # Hi, I'm Ada from London

class Student(Person):
    def __init__(self, name, city, course):
        super().__init__(name, city)
        self.course = course

bo = Student("Bo", "Leeds", "Computing")
print(bo.greet(), "and I study", bo.course)`,

<script>
(function(){

var editors = {};
function getCode(id){ var ed = editors[id]; if (ed) return ed.getValue(); var ta = document.getElementById("code-" + id); return ta ? ta.value : ""; }
function setCode(id, v){ var ed = editors[id]; if (ed) ed.setValue(v); else { var ta = document.getElementById("code-" + id); if (ta) ta.value = v; } }
function codeChanged(id, v){
  if (id === "playground"){ state.code.playground = v; save(); return; }
  var p = byId(id); if (!p) return;
  if (v === p.starter) delete state.code[id]; else state.code[id] = v;
  save();
}
function initEditors(){
  editors = {};
  if (!window.CodeMirror) return;
  Array.prototype.forEach.call(view.querySelectorAll("textarea.code"), function(ta){

      mode:"python", lineNumbers:true, indentUnit:4, tabSize:4, indentWithTabs:false, smartIndent:true,
      matchBrackets:true, autoCloseBrackets:true, viewportMargin:Infinity, lineWrapping:false,

        "Shift-Tab":"indentLess",
        "Ctrl-Enter":function(){ quickAction(id); }, "Cmd-Enter":function(){ quickAction(id); }
      }
    });
    ed.on("change", function(){ codeChanged(id, ed.getValue()); });
    editors[id] = ed;
  });
}
function quickAction(id){
  var card = view.querySelector('[data-id="' + id + '"]'); if (!card) return;
  var b = card.querySelector('button[data-act="check"]') || card.querySelector('button[data-act="run"]');
  if (b && !b.disabled) b.click();
}
var TRACKS = [
  {key:"basics", name:"Python basics", note:"The core topics of 30 Days of Python, one lesson at a time. No deadlines.", lessons:BASICS},
  {key:"lesson", name:"Problem solving", note:"Data structures and algorithms for LeetCode. Start once the basics feel comfortable.", lessons:LESSONS}
];
var all = [], lessonsAll = [];
TRACKS.forEach(function(T){
  T.lessons.forEach(function(L, i){
    L.n = i + 1; L.track = T; L.slug = T.key + "-" + L.n;
    L.rkey = (T.key === "basics" ? "b" : "") + L.n;

});
function byId(id){ for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i]; return null; }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function rich(s){ return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
function pad(n){ return (n < 10 ? "0" : "") + n; }

/* ---------- saving ---------- */
function normalise(s){
  s = s && typeof s === "object" ? s : {};
  return {status:s.status || {}, code:s.code || {}, read:s.read || {}, updated:Number(s.updated) || 0};
}
try { var raw = localStorage.getItem(KEY); if (raw) state = normalise(JSON.parse(raw)); } catch (e) {}

var cloudRef = null, cloudDirty = false, cloudBusy = false, cloudTimer = null;
var syncEl = document.getElementById("sync");
function setSync(t){ syncEl.textContent = t; }
function save(){
  state.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  if (cloudRef){ cloudDirty = true; clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 1200); setSync("Saving…"); }
}
function pushCloud(){
  if (!cloudRef || cloudBusy || !cloudDirty) return;
  cloudBusy = true; cloudDirty = false;
  cloudRef.set(JSON.parse(JSON.stringify(state))).then(function(){
    cloudBusy = false;
    if (cloudDirty) pushCloud(); else setSync("Synced across your devices");
  }, function(){ cloudBusy = false; setSync("Saved on this device"); });
}
function pullCloud(){
  if (!cloudRef || cloudDirty || cloudBusy) return Promise.resolve();
  return cloudRef.get().then(function(snap){
    var remote = snap && snap.exists ? normalise(snap.data()) : null;
    if (remote && remote.updated > state.updated){
      state = remote;
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
      render();
    } else if (state.updated > (remote ? remote.updated : 0)){
      cloudDirty = true; pushCloud(); return;
    }
    setSync("Synced across your devices");
  }, function(){ setSync("Saved on this device"); });
}
function waitClaude(){
  return new Promise(function(res){
    var tries = 0;
    (function poll(){
      if (window.claude && typeof window.claude.use === "function") return res(window.claude);
      if (++tries > 40) return res(null);
      setTimeout(poll, 100);
    })();
  });
}
function cap(name){ return waitClaude().then(function(c){ return c ? c.use(name) : null; }).catch(function(){ return null; }); }
var sample = null;
cap("sample").then(function(s){ if (s){ sample = s; document.body.classList.add("ai"); } });
Promise.all([cap("db"), cap("user")]).then(function(r){
  var db = r[0], user = r[1];
  if (!db || !user) return;
  return user.id().then(function(uid){
    if (!uid) return;
    cloudRef = db.doc("data/users/" + uid + "/progress");
    return pullCloud();
  });
}).catch(function(){});

/* ---------- Firebase sync (when hosted outside Claude, e.g. GitHub Pages) ---------- */
function firstSync(uid){
  // First sign-in on this device: combine this device's progress with the account's,
  // so signing in on a new phone never wipes out progress made elsewhere.
  var flag = KEY + "-synced-" + uid, seen = false;
  try { seen = localStorage.getItem(flag) === "1"; } catch (e) {}
  if (seen) return pullCloud();
  setSync("Syncing…");
  return cloudRef.get().then(function(snap){
    var remote = snap && snap.exists ? normalise(snap.data()) : null;
    if (remote) ["status", "code", "read"].forEach(function(k){ state[k] = Object.assign({}, remote[k], state[k]); });
    try { localStorage.setItem(flag, "1"); } catch (e) {}
    save(); render();
  }, function(){ setSync("Saved on this device"); });
}
(function(){
  var cfg = window.FIREBASE_CONFIG, btn = document.getElementById("acct");
  if (!cfg || !cfg.apiKey || !btn || window.claude) return;
  var FB = "https://www.gstatic.com/firebasejs/10.12.2/";
  Promise.all([import(FB + "firebase-app.js"), import(FB + "firebase-auth.js"), import(FB + "firebase-firestore.js")]).then(function(m){
    if (cloudRef) return; // already syncing through Claude
    var appM = m[0], authM = m[1], fsM = m[2];
    var app = appM.initializeApp(cfg), auth = authM.getAuth(app), db = fsM.getFirestore(app);
    var foot = document.querySelector(".foot");
    btn.hidden = false;
    btn.onclick = function(){
      if (auth.currentUser){ authM.signOut(auth); return; }
      var prov = new authM.GoogleAuthProvider();
      authM.signInWithPopup(auth, prov).catch(function(e){
        var code = e && e.code;
        if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment") return authM.signInWithRedirect(auth, prov);
        if (code !== "auth/popup-closed-by-user" && code !== "auth/cancelled-popup-request") setSync("Sign-in failed");
      });
    };
    authM.onAuthStateChanged(auth, function(user){
      if (!user){
        cloudRef = null; cloudDirty = false; clearTimeout(cloudTimer);
        btn.textContent = "Sign in to sync"; setSync("Saved on this device");
        if (foot) foot.textContent = "Go at your own pace. Your code and progress are saved on this device as you type. Sign in to sync them across your devices.";
        return;
      }
      btn.textContent = "Sign out";
      if (foot) foot.textContent = "Go at your own pace. Signed in as " + (user.email || "you") + ": your code and progress sync across your devices.";

        set: function(d){ return fsM.setDoc(ref, d); },
        get: function(){ return fsM.getDoc(ref).then(function(s){ return {exists: s.exists(), data: function(){ return s.data(); }}; }); }
      };
      firstSync(user.uid);
    });
  }).catch(function(){});
})();

function lessonView(L){

    h += '<article class="prob ' + p.d + (isDone(p) ? ' done' : '') + '" data-id="' + p.id + '">';
    h += '<div class="phead"><span class="pill ' + p.d + '">' + DIFF[p.d] + '</span>';
    if (p.lc) h += '<span>LeetCode ' + p.lc + '</span><a href="https://leetcode.com/problemset/?search=' + encodeURIComponent(p.title) + '">Find on LeetCode</a>';
    h += '</div><h3>' + esc(p.title) + '</h3><p>' + rich(p.text) + '</p>';
    h += '<textarea class="code" id="code-' + p.id + '" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Your code for ' + esc(p.title) + '">' + esc(code) + '</textarea>';
    h += '<div class="btns">';
    h += '<button class="btn primary" data-act="check">Check answer</button>';
    h += '<button class="btn" data-act="run">Run</button>';
    h += '<button class="btn" data-act="hint">Hint</button>';
    h += '<button class="btn needs-ai" data-act="review">Review my code</button>';
    h += '<button class="btn' + (isDone(p) ? ' solved' : '') + '" data-act="done">' + (isDone(p) ? 'Solved ✓' : 'Mark solved') + '</button>';
    h += '<button class="btn" data-act="reset">Reset</button>';
    h += '</div>';
    h += '<p class="no-ai">For a review, paste your code into your chat with Claude.</p>';
    h += '<div class="panel results" data-slot="check" hidden></div>';
    h += '<div class="panel out" data-slot="out" hidden></div>';
    h += '<div class="panel note" data-slot="hint" hidden></div>';
    h += '<div class="panel note" data-slot="review" hidden></div>';
    h += '</article>';
  });
  var i = lessonsAll.indexOf(L), prev = lessonsAll[i - 1], next = lessonsAll[i + 1];
  h += '<nav class="nav2">' + (prev ? '<a href="#' + prev.slug + '">← ' + esc(prev.title) + '</a>' : '<span></span>');
  h += (next ? '<a href="#' + next.slug + '">' + esc(next.title) + ' →</a>' : '<span></span>') + '</nav>';
  view.innerHTML = h;
  view.style.cssText = "display:flex;flex-direction:column;gap:16px";
  initEditors();
}

var PLAY_START = "# Type any Python here, then press Run\n\nname = \"Moh\"\nfor i in range(3):\n    print(f\"Hello {name}, line {i + 1}\")\n";
function playgroundView(){
  var code = state.code.playground != null ? state.code.playground : PLAY_START;
  var h = '<a class="back" href="#home">← All lessons</a>';
  h += '<div class="lesson-head"><span class="num">Scratchpad</span><h1>Playground</h1><p class="cx">Try out anything you like. Your code here is saved too.</p></div>';
  h += '<article class="prob play" data-id="playground">';
  h += '<textarea class="code" id="code-playground" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Playground code">' + esc(code) + '</textarea>';
  h += '<div class="btns"><button class="btn primary" data-act="run">Run</button><button class="btn" data-act="clear">Clear</button></div>';
  h += '<div class="panel out" data-slot="out" hidden></div>';
  h += '</article>';
  view.innerHTML = h;
  view.style.cssText = "display:flex;flex-direction:column;gap:16px";
  initEditors();
}

var shown = null;
function render(){
  var m = /^#(basics|lesson)-(\d+)$/.exec(location.hash || ""), L = null;
  if (m){ var T = m[1] === "basics" ? TRACKS[0] : TRACKS[1]; L = T.lessons[Number(m[2]) - 1] || null; }
  var play = location.hash === "#playground";
  var key = play ? "playground" : L ? L.slug : "home";
  if (play) playgroundView(); else if (L) lessonView(L); else homeView();
  if (shown !== key){ window.scrollTo(0, 0); shown = key; }
}
window.addEventListener("hashchange", render);

/* ---------- running Python ---------- */
var PY = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
var worker = null, workerReady = null;
function startWorker(){
  var src = [
    "var HARNESS = " + JSON.stringify(HARNESS) + ";",
    "var ready = null;",
    "try { importScripts('" + PY + "pyodide.js'); ready = loadPyodide({indexURL:'" + PY + "'}); }",
    "catch (e) { postMessage({loadError:String(e)}); }",
    "if (ready) ready.then(function(){ postMessage({ready:true}); }, function(e){ postMessage({loadError:String(e)}); });",
    "onmessage = async function(e){",
    "  var out = [];",
    "  try {",
    "    var py = await ready;",
    "    py.setStdout({batched:function(s){ out.push(s); }});",
    "    py.setStderr({batched:function(s){ out.push(s); }});",
    "    var g = py.globals.get('dict')();",
    "    if (e.data.tests) {",
    "      g.set('__user', e.data.code); g.set('__prelude', e.data.prelude || ''); g.set('__tests', e.data.tests);",
    "      py.runPython(HARNESS, {globals:g});",
    "      postMessage({done:true, ok:true, check:g.get('__result')});",
    "      return;",
    "    }",
    "    if (e.data.prelude) py.runPython(e.data.prelude, {globals:g});",
    "    py.runPython(e.data.code, {globals:g});",
    "    postMessage({done:true, ok:true, out:out.join('\\n')});",
    "  } catch (err) {",
    "    postMessage({done:true, ok:false, out:out.join('\\n'), err:String((err && err.message) || err)});",
    "  }",
    "};"
  ].join("\n");
  var w = new Worker(URL.createObjectURL(new Blob([src], {type:"text/javascript"})));
  worker = w;
  workerReady = new Promise(function(res, rej){
    var t = setTimeout(function(){ rej(new Error("timeout")); }, 90000);
    function onMsg(e){
      if (e.data && e.data.ready){ clearTimeout(t); w.removeEventListener("message", onMsg); res(); }
      else if (e.data && e.data.loadError){ clearTimeout(t); rej(new Error(e.data.loadError)); }
    }
    w.addEventListener("message", onMsg);
    w.addEventListener("error", function(){ clearTimeout(t); rej(new Error("worker")); });
  });
  workerReady.catch(function(){ try { w.terminate(); } catch (e) {} if (worker === w){ worker = null; workerReady = null; } });
}
function runPython(prelude, code, tests){
  if (!worker){ try { startWorker(); } catch (e) { return Promise.reject(e); } }
  var w = worker;
  return workerReady.then(function(){
    return new Promise(function(res){
      var t = setTimeout(function(){
        try { w.terminate(); } catch (e) {}
        if (worker === w){ worker = null; workerReady = null; }
        res({ok:false, out:"", err:"Stopped after 10 seconds. Check for a loop that never ends."});
      }, 10000);
      w.onmessage = function(e){ if (e.data && e.data.done){ clearTimeout(t); res(e.data); } };
      w.postMessage({prelude:prelude || "", code:code, tests:tests || null});
    });
  });
}
function tidyError(s){
  var i = s.indexOf('  File "<exec>"');
  return i >= 0 ? "Traceback (most recent call last):\n" + s.slice(i) : s;
}

/* ---------- asking Claude ---------- */
function renderAnswer(el, label, text){
  el.innerHTML = "";
  var l = document.createElement("span"); l.className = "lbl"; l.textContent = label; el.appendChild(l);
  String(text).split("```").forEach(function(part, i){
    if (!part.trim()) return;
    if (i % 2){
      var pre = document.createElement("pre"); pre.textContent = part.replace(/^[a-zA-Z]*\n/, "").replace(/\s+$/, ""); el.appendChild(pre);
    } else {
      var d = document.createElement("div"); d.className = "txt"; d.textContent = part.trim(); el.appendChild(d);
    }
  });
}
function ask(kind, p, code, el, btn){
  var label = kind === "hint" ? "Hint from Claude" : "Review from Claude";
  var basics = p.lesson.track.key === "basics";
  var prompt = "You are a patient, encouraging Python tutor. " +
    (basics ? "The learner is a beginner working through the lesson \"" + p.lesson.title + "\". Use simple words and an everyday comparison where it helps.\n"
            : "The learner is practising for LeetCode.\n") +
    "Exercise: " + (p.lc ? "LeetCode " + p.lc + ", " : "") + p.title + ". " + p.text + "\n\n" +
    "The learner's current code:\n```python\n" + code + "\n```\n\n";
  if (kind === "hint"){
    prompt += "They have already seen this hint: " + p.hint + "\nGive ONE further hint in at most three sentences that moves them a single step forward from where their code is now. Do not write the solution and do not write code. Plain text only.";
  } else {
    prompt += "Review this attempt in under 250 words, in plain text with no markdown headings or bold.\n" +
      "1. Say whether it is correct. If not, give one small input where it fails and say why.\n" +
      "2. " + (basics ? "Point out one thing they did well." : "Give its time and space complexity.") + "\n" +
      "3. If it is correct or nearly correct, show a cleaner version in a ```python code block and say what changed. If it is far from working, do not give the solution; give the next step to try instead.";
  }
  el.hidden = false; renderAnswer(el, label, "Thinking…");
  btn.disabled = true;
  sample(prompt, {cache:false, onText:function(m){ if (m && m.text) renderAnswer(el, label, m.text); }}).then(function(r){
    renderAnswer(el, label, (r && r.text) || "No answer came back. Try again in a moment.");
  }, function(err){
    var msg = err && err.code === "rate_limited" ? "Claude is busy right now. Wait a minute and try again." : "Could not reach Claude from this page. Paste your code into your chat with Claude instead.";
    renderAnswer(el, label, (err && err.text) ? err.text : msg);
  }).then(function(){ btn.disabled = false; });
}

function showResults(el, results, error, output){
  el.innerHTML = "";
  function add(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; el.appendChild(n); return n; }
  var passed = false;
  if (error){
    el.className = "panel results fail";
    add("div", "rhead", "Your code stopped with an error");
    add("pre", "", error);
    add("p", "cx", "Read the last line first: it names the problem. The line number tells you where.");
  } else {
    var n = results.filter(function(x){ return x.ok; }).length;
    passed = n === results.length;
    el.className = "panel results " + (passed ? "pass" : "fail");
    add("div", "rhead", passed ? "All " + n + " tests passed. Nicely done." : n + " of " + results.length + " tests passed");
    var list = add("ul", "tests");
    results.forEach(function(t){
      var li = document.createElement("li"); li.className = t.ok ? "ok" : "no";
      var mark = document.createElement("span"); mark.className = "mark"; mark.textContent = t.ok ? "✓" : "✗"; li.appendChild(mark);
      var body = document.createElement("span");
      var lab = document.createElement("code"); lab.textContent = t.label; body.appendChild(lab);
      if (!t.ok){
        var d = document.createElement("span"); d.className = "diff";
        d.textContent = "Expected " + t.want + ", got " + t.got; body.appendChild(d);
      }
      li.appendChild(body); list.appendChild(li);
    });
    if (passed) add("p", "cx", "Marked as solved. Want a cleaner or faster version? Try Review my code, or paste it into your chat with Claude.");
  }
  if (output && output.trim()){
    var det = add("details", "");
    var sm = document.createElement("summary"); sm.textContent = "What your code printed"; det.appendChild(sm);
    var pre = document.createElement("pre"); pre.textContent = output.length > 3000 ? output.slice(0, 3000) + "\n…" : output; det.appendChild(pre);
  }
  return passed;
}

/* ---------- events ---------- */
view.addEventListener("click", function(ev){
  var btn = ev.target.closest("button[data-act]"); if (!btn) return;
  var card = btn.closest(".prob"), id = card.getAttribute("data-id"), p = byId(id);
  var code = getCode(id), act = btn.getAttribute("data-act");
  var out = card.querySelector('[data-slot="out"]'), hint = card.querySelector('[data-slot="hint"]'), review = card.querySelector('[data-slot="review"]'), chk = card.querySelector('[data-slot="check"]');
  if (act === "clear"){ setCode(id, ""); if (editors[id]) editors[id].focus(); out.hidden = true; return; }
  if (act === "check"){
    var tests = TESTS[id];
    chk.hidden = false; chk.className = "panel results"; out.hidden = true;
    chk.textContent = worker ? "Checking…" : "Loading Python. The first check takes a few seconds…";
    btn.disabled = true;
    runPython(p.lesson.prelude, code, JSON.stringify(tests)).then(function(r){
      if (!r.ok || !r.check){ showResults(chk, null, r.err || "Something went wrong.", ""); return; }
      var res = JSON.parse(r.check);
      var passed = showResults(chk, res.results, res.error, res.out);
      if (passed && !isDone(p)){
        state.status[id] = "done"; save();
        card.classList.add("done");
        var db = card.querySelector('button[data-act="done"]'); db.classList.add("solved"); db.textContent = "Solved ✓";
      }
    }, function(){
      showResults(chk, null, "Python could not load right now. Check your connection and try again.", "");
    }).then(function(){ btn.disabled = false; });
    return;
  }
  if (act === "run"){
    out.hidden = false; out.className = "panel out";
    out.textContent = worker ? "Running…" : "Loading Python. The first run takes a few seconds…";
    btn.disabled = true;
    runPython(p ? p.lesson.prelude : "", code).then(function(r){
      var text = r.out || "";
      if (!r.ok){ text += (text ? "\n" : "") + tidyError(r.err || "Error"); out.className = "panel out err"; }
      else if (!text) text = "Ran with no output. Add a print(...) line to see a result.";
      out.textContent = text.length > 4000 ? text.slice(0, 4000) + "\n… output cut" : text;
    }, function(){
      out.className = "panel out err";
      out.textContent = "Python could not load right now. Check your connection and tap Run again.";
    }).then(function(){ btn.disabled = false; });
  } else if (act === "hint"){
    if (hint.hidden || !sample){
      hint.hidden = false; renderAnswer(hint, "Hint", p.hint);
      if (sample) btn.textContent = "Another hint";
    } else {
      ask("hint", p, code, hint, btn);
    }
  } else if (act === "review"){
    if (code.trim() === p.starter.trim() || code.trim().length < 20){
      review.hidden = false; renderAnswer(review, "Review", "Write your own attempt first. Even a broken one is worth reviewing.");
      return;
    }
    if (sample) ask("review", p, code, review, btn);
  } else if (act === "done"){
    if (isDone(p)) delete state.status[id]; else state.status[id] = "done";
    save();
    card.classList.toggle("done", isDone(p));
    btn.classList.toggle("solved", isDone(p));
    btn.textContent = isDone(p) ? "Solved ✓" : "Mark solved";
  } else if (act === "reset"){
    if (btn.getAttribute("data-sure")){
      setCode(id, p.starter); delete state.code[id]; save();
      btn.removeAttribute("data-sure"); btn.textContent = "Reset";
    } else {
      btn.setAttribute("data-sure", "1"); btn.textContent = "Tap again to clear your code";
      setTimeout(function(){ btn.removeAttribute("data-sure"); btn.textContent = "Reset"; }, 4000);
    }
  }
});
view.addEventListener("input", function(ev){
  var ta = ev.target;
  if (!ta.classList || !ta.classList.contains("code")) return;
  codeChanged(ta.id.slice(5), ta.value);
});
view.addEventListener("change", function(ev){
  var m = /^read-(b?\d+)$/.exec(ev.target.id || ""); if (!m) return;
  if (ev.target.checked) state.read[m[1]] = 1; else delete state.read[m[1]];
  save();
});
view.addEventListener("keydown", function(ev){
  var ta = ev.target;
  if (!ta.classList || !ta.classList.contains("code")) return;
  var s = ta.selectionStart, e = ta.selectionEnd, v = ta.value, ins = null;
  if (ev.key === "Tab" && !ev.shiftKey && !ev.ctrlKey && !ev.metaKey && !ev.altKey) ins = "    ";
  else if (ev.key === "Enter" && !ev.isComposing){
    var line = v.slice(v.lastIndexOf("\n", s - 1) + 1, s);
    var indent = (/^[ \t]*/.exec(line) || [""])[0];
    if (/:\s*$/.test(line)) indent += "    ";
    ins = "\n" + indent;
  }
  if (ins === null) return;
  ev.preventDefault();
  ta.value = v.slice(0, s) + ins + v.slice(e);
  ta.selectionStart = ta.selectionEnd = s + ins.length;
  ta.dispatchEvent(new Event("input", {bubbles:true}));
});

if ("serviceWorker" in navigator && /github\.io$|^localhost$/.test(location.hostname)){
  try { navigator.serviceWorker.register("sw.js").catch(function(){}); } catch (e) {}
}
render();
})();
